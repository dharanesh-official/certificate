<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #050816;
    }

    /* Animated gradient background */
    body::before {
      content: "";
      position: fixed;
      inset: -50%;
      background:
        radial-gradient(circle at 20% 30%, #6c3cff55, transparent 30%),
        radial-gradient(circle at 80% 70%, #00d9ff44, transparent 30%),
        radial-gradient(circle at 50% 50%, #ff3cac22, transparent 35%);
      animation: backgroundMove 12s ease-in-out infinite alternate;
      z-index: -3;
    }

    @keyframes backgroundMove {
      0% {
        transform: translate(-5%, -5%) scale(1);
      }
      100% {
        transform: translate(5%, 5%) scale(1.15);
      }
    }

    /* Grid */
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 50px 50px;
      mask-image: linear-gradient(to bottom, transparent, black, transparent);
      z-index: -2;
    }

    /* Glowing orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.7;
      z-index: -1;
    }

    .orb.one {
      width: 180px;
      height: 180px;
      background: #7c3aed;
      top: 10%;
      left: 8%;
      animation: floatOne 7s ease-in-out infinite;
    }

    .orb.two {
      width: 140px;
      height: 140px;
      background: #06b6d4;
      bottom: 10%;
      right: 10%;
      animation: floatTwo 8s ease-in-out infinite;
    }

    @keyframes floatOne {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(60px, 40px);
      }
    }

    @keyframes floatTwo {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(-50px, -50px);
      }
    }

    /* Main card */
    .container {
      width: min(90%, 700px);
      padding: 60px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 30px;
      background: rgba(255,255,255,0.055);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 30px 80px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.08);
      animation: cardIn 1s ease-out;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Icon */
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 38px;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      box-shadow:
        0 0 25px #7c3aed88,
        0 0 60px #06b6d444;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow:
          0 0 25px #7c3aed88,
          0 0 60px #06b6d444;
      }
      50% {
        transform: scale(1.08);
        box-shadow:
          0 0 40px #7c3aedaa,
          0 0 90px #06b6d466;
      }
    }

    .small-title {
      margin-bottom: 15px;
      color: #a5b4fc;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 20px;
      font-size: clamp(42px, 9vw, 82px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
      background: linear-gradient(
        90deg,
        #ffffff,
        #c4b5fd,
        #67e8f9,
        #ffffff
      );
      background-size: 300% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 5s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 300% center;
      }
    }

    p {
      max-width: 500px;
      margin: 0 auto;
      color: #a9b2c7;
      font-size: 17px;
      line-height: 1.7;
    }

    .line {
      width: 80px;
      height: 3px;
      margin: 30px auto;
      border-radius: 10px;
      background: linear-gradient(90deg, #7c3aed, #06b6d4);
      box-shadow: 0 0 15px #06b6d4;
      animation: lineGlow 2s ease-in-out infinite alternate;
    }

    @keyframes lineGlow {
      from {
        width: 60px;
        opacity: 0.6;
      }
      to {
        width: 120px;
        opacity: 1;
      }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 30px;
      padding: 10px 18px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px;
      background: rgba(255,255,255,0.05);
      color: #cbd5e1;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 12px #22c55e;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.3;
      }
    }

    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.5;
      animation: particleFloat linear infinite;
    }

    .p1 { left: 10%; animation-duration: 8s; bottom: -10px; }
    .p2 { left: 25%; animation-duration: 11s; bottom: -10px; }
    .p3 { left: 42%; animation-duration: 9s; bottom: -10px; }
    .p4 { left: 60%; animation-duration: 13s; bottom: -10px; }
    .p5 { left: 75%; animation-duration: 10s; bottom: -10px; }
    .p6 { left: 90%; animation-duration: 12s; bottom: -10px; }

    @keyframes particleFloat {
      0% {
        transform: translateY(0) scale(0);
        opacity: 0;
      }
      20% {
        opacity: 0.6;
      }
      80% {
        opacity: 0.3;
      }
      100% {
        transform: translateY(-110vh) scale(1);
        opacity: 0;
      }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .container {
        padding: 45px 20px;
        border-radius: 24px;
      }

      .icon {
        width: 65px;
        height: 65px;
        font-size: 30px;
      }

      h1 {
        letter-spacing: -2px;
      }

      p {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="grid"></div>

  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>

  <main class="container">

    <div class="icon">🚀</div>

    <div class="small-title">Something Amazing</div>

    <h1>Coming Soon</h1>

    <div class="line"></div>

    <p>
      We're working behind the scenes to bring you something
      incredible. Stay tuned — we'll be launching very soon.
    </p>

    <div class="status">
      <span class="dot"></span>
      Currently under development
    </div>

  </main>

</body>
</html>
